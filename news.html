<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYFL - NEWS</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:28px 18px}
.back{color:#aeb8c8;text-decoration:none}.back:hover{color:#fff}
.news-card{margin-top:24px;border:1px solid rgba(255,255,255,.09);border-radius:18px;
background:linear-gradient(145deg,#151f34,#0d1321);padding:26px}
.news-label{display:inline-block;background:#e21d48;color:white;font-weight:800;padding:7px 11px;border-radius:8px;font-size:12px;letter-spacing:.4px}
.news-card h1{font-size:28px;margin:18px 0 14px}.message{font-size:18px;line-height:1.65;color:#e8edf5}
.author{margin-top:22px;font-weight:800;color:#fff}.author span{color:#7f8da5;font-weight:500}
.fyfl-discord-button{position:fixed;left:18px;bottom:18px;width:52px;height:52px;border-radius:50%;
display:flex;align-items:center;justify-content:center;z-index:9999;background:#5865F2;
box-shadow:0 8px 24px rgba(0,0,0,.35);transition:.18s}
.fyfl-discord-button:hover{transform:scale(1.08)}.fyfl-discord-button svg{width:29px;height:29px;fill:#fff}
@media(max-width:700px){.wrap{padding:20px 14px}.news-card{padding:20px}.news-card h1{font-size:24px}.message{font-size:16px}.fyfl-discord-button{left:14px;bottom:14px;width:48px;height:48px}}

/* FYFL V9 page transition */
body.fyfl-page-v9{animation:fyflFade .45s ease both}
@keyframes fyflFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="fyfl-page-v9">
<main class="wrap">
<a class="back" href="index.html">← Retour à l'accueil</a>
<article class="news-card">
  <div class="news-label">FYFL - NEWS</div>
  <h1>FYFL NEW !</h1>
  <div class="message">
    Les matchs FYFL se joueront que les <strong>mercredis</strong> !<br><br>
    Oubliez pas qu'il faut être <strong>actif sur le Discord</strong> !<br><br>
    Merci à tous !
  </div>
  <div class="author">Tutzou <span>— FYFL</span></div>
</article>
</main>
<a class="fyfl-discord-button" href="https://discord.gg/fyfl" target="_blank" rel="noopener noreferrer" aria-label="Rejoindre le Discord FYFL" title="Discord FYFL">
<svg viewBox="0 0 24 24"><path d="M19.54 5.19A16.9 16.9 0 0 0 15.5 4l-.49 1.02a15.3 15.3 0 0 0-4.02 0L10.5 4a16.9 16.9 0 0 0-4.04 1.19C3.9 8.75 3.2 12.2 3.55 15.6a16.4 16.4 0 0 0 4.97 2.51l1.2-1.63c-.66-.24-1.3-.54-1.9-.9l.46-.35c3.67 1.72 7.65 1.72 11.28 0l.47.35c-.6.36-1.24.66-1.9.9l1.2 1.63a16.4 16.4 0 0 0 4.97-2.51c.41-3.94-.7-7.36-4.76-10.41ZM8.76 14.1c-1.1 0-2-.99-2-2.2s.88-2.2 2-2.2c1.13 0 2.01.99 2 2.2 0 1.21-.88 2.2-2 2.2Zm6.48 0c-1.1 0-2-.99-2-2.2s.88-2.2 2-2.2c1.13 0 2.01.99 2 2.2s-.88 2.2-2 2.2Z"/></svg>
</a>
</body>
</html>
