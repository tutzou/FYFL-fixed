t:1000}.group-count{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;padding:0}.table-wrap table{width:100%;border-collapse:collapse;min-width:720px}.table-wrap th,.table-wrap td{padding:11px 9px;text-align:center;border-bottom:1px solid #202733;font-size:13px}.table-wrap th{color:var(--muted);font-size:11px;text-transform:uppercase}.team-cell{text-align:left!important;display:flex;align-items:center;gap:8px;font-weight:850}.pos{font-weight:1000}.pts{font-weight:1000;color:#76a0ff}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tabs button,.group-links button{background:#111720;border:1px solid #303846;color:#b9c2d1;padding:9px 13px;border-radius:9px;font-weight:900;white-space:nowrap}.tabs button.active,.group-links button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}.fixture{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);background:#0d1219;border-radius:10px;margin:7px 0;font-weight:800}.fixture span{display:flex;align-items:center;gap:7px}.fixture em{font-style:normal;color:var(--orange);font-size:12px}.group-fixtures-title,.subheading{margin:22px 0 10px;font-weight:1000}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.team-card{text-align:center}.team-card p{color:var(--muted);margin-bottom:0}.fyfl-comp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.fyfl-comp-card{display:flex;justify-content:space-between;gap:15px;align-items:center}.comp-name{font-weight:1000}.fyfl-comp-card p{color:var(--muted);line-height:1.5}.coming{padding:7px 9px;border-radius:8px;background:#18202b;color:#9ca6b7;font-size:11px;font-weight:1000;white-space:nowrap}.news-card{max-width:850px}.results-head-actions{display:flex;align-items:center;gap:8px}.results-head-actions button{background:#151b25;border:1px solid #303846;color:#fff;border-radius:9px;padding:7px 9px;font-weight:800}.comment-form{display:grid;gap:9px}.comment-form input,.comment-form textarea,.admin-box input,.admin-box textarea,.admin-box select,.auth-box input{width:100%;background:#0b1017;border:1px solid #303846;color:#fff;border-radius:9px;padding:11px;outline:none}.comments{display:grid;gap:10px}.comment-item strong{display:block}.comment-item small{color:var(--muted)}.comment-item p{white-space:pre-wrap;line-height:1.55}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-box{background:#0d1219;border:1px solid var(--line);border-radius:14px;padding:16px}.admin-box h3{margin-top:0}.admin-box label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:10px 0 6px}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.admin-actions .live{background:#e21d48}.admin-actions .done{background:#1b8f50}.admin-actions .reset{background:#6b2631}.admin-help{color:var(--muted);font-size:12px;line-height:1.6}.admin-stat{display:flex;align-items:center;gap:8px;margin:12px 0}.admin-stat input{max-width:90px}.goal-line button{float:right;background:#59202a;border:0;color:#fff;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:center;padding:20px}.auth-box{width:min(430px,100%);background:#10151e;border:1px solid #303846;border-radius:16px;padding:20px}.auth-box h2{margin-top:0}.auth-actions{display:flex;gap:8px;margin-top:12px}.auth-actions button{flex:1;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:900}.auth-actions button.secondary{background:#151b25;border:1px solid #303846}.error{color:#ff7589;font-size:13px;margin-top:10px}.fyfl-live-sync{position:fixed;right:18px;top:78px;z-index:80;background:#15213a;border:1px solid #2d4d88;color:#9ec0ff;padding:8px 11px;border-radius:9px;font-size:12px;font-weight:900;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.fyfl-live-sync.show{opacity:1;transform:none}.goal-pop{position:fixed;inset:0;z-index:120;display:grid;place-items:center;pointer-events:none}.goal-box{background:#10151e;border:2px solid #ff3151;border-radius:20px;padding:28px 45px;text-align:center;box-shadow:0 0 60px rgba(255,22,53,.35);animation:goalPop .9s ease}.goal-box .big{font-size:60px}.goal-box h2{font-size:38px;margin:5px}.goal-box p{color:#c7cfdb}.confetti{position:fixed;top:-15px;width:8px;height:14px;background:#fff;z-index:121;animation:fall 1.8s linear forwards}@keyframes fall{to{top:110vh;transform:rotate(720deg)}}@keyframes goalPop{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}.fyfl-animate-item{animation:itemIn .35s ease both}@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.halloween-theme{background:radial-gradient(circle at 50% -10%,#29102d 0,#08070c 45%)}.halloween-fall{position:fixed;top:-40px;z-index:70;animation:spookyFall linear forwards;pointer-events:none}@keyframes spookyFall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}.fyfl-bottom-controls{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;gap:8px}.fyfl-discord-button,.fyfl-sound-button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #303846;background:#111720;color:#fff;box-shadow:0 8px 25px rgba(0,0,0,.3)}.fyfl-discord-button svg{width:24px;fill:#fff}.fyfl-sound-button{font-size:20px}.fyfl-sound-button.muted{opacity:.65}.halloween-toggle{position:fixed;left:16px;bottom:16px;z-index:90;background:#111720;color:#fff;border:1px solid #303846;border-radius:10px;padding:9px 11px;font-weight:900}
.halloween-overlay{position:fixed;inset:0;z-index:150;background:radial-gradient(circle,#211128,#050509 70%);display:grid;place-items:center;padding:20px}.halloween-intro{max-width:560px;text-align:center;background:#0d1018;border:1px solid #4b274e;border-radius:18px;padding:28px;box-shadow:0 0 80px rgba(159,42,178,.18)}.halloween-intro h1{font-size:42px;margin:5px}.halloween-intro p{color:#b9aabd;line-height:1.6}.halloween-intro button{background:#7d2b91;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:1000}
@media(max-width:850px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-left:auto;margin-right:auto}.hero-logo{width:220px}.feature-grid,.admin-grid,.grid,.fyfl-comp-grid{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}nav{order:3;width:100%}.nav{flex-wrap:wrap}.brand{flex:1}.account-btn{margin-left:auto}}
@media(max-width:500px){main{padding:18px 12px 60px}.teams{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}.fyfl-bottom-controls{right:10px;bottom:10px}.halloween-toggle{left:10px;bottom:10px}}
</style>

<body>
<div id="halloweenOverlay" class="halloween-overlay">

<header>
  <div class="nav">

<div id="breakingNewsText" style="background:#e21d48;color:#fff;text-align:center;padding:7px 12px;font-size:12px;font-weight:900">REJOIGNEZ LE DISCORD POUR TOUTE LES INFO !</div>
<div id="fyflLiveSync" class="fyfl-live-sync">✓ Synchronisé en direct</div>
<main id="app"></main>

<button id="halloweenToggle" class="halloween-toggle" onclick="toggleHalloween()">🌙 Halloween OFF</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FYFL_SUPABASE_URL="https://dxbaicqbpccruebmlorb.supabase.co";
const FYFL_SUPABASE_KEY="sb_publishable_pglwhtDgDHi6DV931NsfTQ_tUGo4-Jk";
const ADMIN_EMAIL="enzoadressepro888@gmail.com";

const groups={
 A:["ASTON VILLA","OM","BAYER LEVERKUSEN","NEWCASTLE"],
 B:["BARCELONE","BESIKTAS","LIVERPOOL","REAL MADRID"],
 C:["CRYSTAL PALACE","PSG","ATLETICO MADRID","JUVENTUS"],
 D:["AS MONACO","LAZIO FC","D2T","FIORENTINA"],
 E:["INTER MILAN","RED STAR","ARSENAL","AC MILAN"],
 F:["RENNES","CHELSEA","MANCHESTER CITY","BAYERN MUNICH"]
};
const defaultResults=[
 {group:"F",home:"RENNES",away:"CHELSEA",hs:9,as:2,status:"Terminé",minute:90,goals:[]},
 {group:"F",home:"MANCHESTER CITY",away:"BAYERN MUNICH",hs:7,as:0,status:"Terminé",minute:90,goals:[]}
];
const logoUrls={
"ASTON VILLA":"https://assets.football-logos.cc/logos/england/1500x1500/aston-villa.5265a6b0.png","OM":"https://assets.football-logos.cc/logos/france/1500x1500/marseille.6f770410.png","BAYER LEVERKUSEN":"https://assets.football-logos.cc/logos/germany/1500x1500/bayer-leverkusen.ada32552.png","NEWCASTLE":"https://assets.football-logos.cc/logos/england/1500x1500/newcastle.c19d66db.png","BARCELONE":"https://assets.football-logos.cc/logos/spain/1500x1500/barcelona.8e8b43a3.png","BESIKTAS":"https://media.api-sports.io/football/teams/549.png","LIVERPOOL":"https://assets.football-logos.cc/logos/england/1500x1500/liverpool.d03fd250.png","REAL MADRID":"https://assets.football-logos.cc/logos/spain/1500x1500/real-madrid.e34f5ba5.png","CRYSTAL PALACE":"https://assets.football-logos.cc/logos/england/1500x1500/crystal-palace.e3552a3a.png","PSG":"https://assets.football-logos.cc/logos/france/1500x1500/paris-saint-germain.976d063a.png","ATLETICO MADRID":"https://assets.football-logos.cc/logos/spain/1500x1500/atletico-madrid.1acb70ea.png","JUVENTUS":"https://assets.football-logos.cc/logos/italy/1500x1500/juventus.309408e0.png","AS MONACO":"https://assets.football-logos.cc/logos/france/1500x1500/as-monaco.1d58091e.png","LAZIO FC":"lazio-fc.png","D2T":"d2t-logo.png","FIORENTINA":"https://assets.football-logos.cc/logos/italy/1500x1500/fiorentina.3a19a902.png","INTER MILAN":"https://assets.football-logos.cc/logos/italy/1500x1500/inter.d4ebfb95.png","RED STAR":"https://commons.wikimedia.org/wiki/Special:FilePath/Red_Star_Belgrade_crest.svg","ARSENAL":"https://assets.football-logos.cc/logos/england/1500x1500/arsenal.d4144b2a.png","AC MILAN":"https://assets.football-logos.cc/logos/italy/1500x1500/milan.6b4c62be.png","RENNES":"https://assets.football-logos.cc/logos/france/1500x1500/rennes.f07dde44.png","CHELSEA":"https://assets.football-logos.cc/logos/england/1500x1500/chelsea.450170ff.png","MANCHESTER CITY":"https://assets.football-logos.cc/logos/england/1500x1500/manchester-city.8d2b6688.png","BAYERN MUNICH":"https://assets.football-logos.cc/logos/germany/1500x1500/bayern-munchen.1eac18e8.png"
};

let results=defaultResults.map(x=>({...x}));
let fyflSupabase=null,fyflRemoteReady=false,fyflInitPromise=null,fyflRealtimeChannel=null;
let fyflSettings={breaking:"REJOIGNEZ LE DISCORD POUR TOUTE LES INFO !",player:"À déterminer",news:"Les matchs FYFL se joueront les mercredis et les week-ends !",standings:{}};
let fyflComments=[],fyflCommentsReady=false;
let adminUnlocked=false,supabaseAdminUser=null;
window.__fyflLastMatchSyncError="";

function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function initials(n){let a=n.split(" ");return(a.length>1?a[0][0]+a[1][0]:n.slice(0,3)).toUpperCase()}
function crest(n,cls="team-logo"){const u=logoUrls[n];return u?`<img class="${cls}" src="${u}" alt="${escapeHtml(n)}" loading="lazy">`:`<span class="mini-badge">${initials(n)}</span>`}
function findMatchDay(m){
 for(const [g,arr] of Object.entries(groups)){
  const pairs={1:[[arr[0],arr[1]],[arr[2],arr[3]]],2:[[arr[0],arr[2]],[arr[1],arr[3]]],3:[[arr[0],arr[3]],[arr[1],arr[2]]]};
  for(const [d,ps] of Object.entries(pairs))for(const [h,a] of ps)if((m.home===h&&m.away===a)||(m.home===a&&m.away===h))return Number(d);
 }return 1
}
function fyflMatchKey(m){return `${m.group||""}|${m.day||findMatchDay(m)}|${m.home||""}|${m.away||""}`}
function fyflToRow(m){return{match_key:fyflMatchKey(m),group_name:m.group,day:Number(m.day||1),home:m.home,away:m.away,home_score:Number(m.hs||0),away_score:Number(m.as||0),status:m.status||"À venir",minute:Number(m.minute||0),goals:Array.isArray(m.goals)?m.goals:[],started_at:m.startedAt?new Date(m.startedAt).toISOString():null,updated_at:new Date().toISOString()}}
function fyflFromRow(r){return{group:r.group_name,day:Number(r.day),home:r.home,away:r.away,hs:Number(r.home_score??r.hs??0),as:Number(r.away_score??r.as??0),status:r.status||"À venir",minute:Number(r.minute||0),goals:Array.isArray(r.goals)?r.goals:[],...(r.started_at?{startedAt:new Date(r.started_at).getTime()}: {})}}
function setRemoteResults(rows){results=(rows||[]).map(fyflFromRow)}
function isCurrentAccountAdminVerified(){return!!adminUnlocked&&!!supabaseAdminUser&&String(supabaseAdminUser.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()}
async function saveSingleRemoteMatch(m){
 if(!fyflSupabase||!fyflRemoteReady||!isCurrentAccountAdminVerified())return false;
 const row=fyflToRow({...m,day:Number(m.day||findMatchDay(m))});
 const {error}=await fyflSupabase.from("fyfl_matches").upsert(row,{onConflict:"match_key"});
 if(error){window.__fyflLastMatchSyncError=error.message||String(error);console.warn("FYFL match:",error);return false}
 window.__fyflLastMatchSyncError="";return true
}
async function loadOnlineSettings(){
 if(!fyflSupabase)return;
 const {data,error}=await fyflSupabase.from("fyfl_settings").select("*").eq("id","main").maybeSingle();
 if(!error&&data){fyflSettings={...fyflSettings,breaking:data.breaking||fyflSettings.breaking,player:data.player||fyflSettings.player,news:data.news||fyflSettings.news,standings:(data.standings&&typeof data.standings==="object")?data.standings:{}};applyAdminPrefs()}
}
async function saveOnlineSettings(p){
 if(!fyflSupabase||!isCurrentAccountAdminVerified())return false;
 const row={id:"main",breaking:p.breaking||"",player:p.player||"",news:p.news||"",standings:p.standings||{},updated_at:new Date().toISOString()};
 const {error}=await fyflSupabase.from("fyfl_settings").upsert(row,{onConflict:"id"});
 if(error){console.warn("FYFL settings:",error.message);return false}
 fyflSettings={...fyflSettings,...p};applyAdminPrefs();return true
}
async function loadOnlineComments(){
 if(!fyflSupabase)return;
 const {data,error}=await fyflSupabase.from("fyfl_comments").select("*").order("created_at",{ascending:false});
 if(!error){fyflComments=data||[];fyflCommentsReady=true}
}
async function initFYFLSupabase(){
 if(fyflInitPromise)return fyflInitPromise;
 fyflInitPromise=(async()=>{
  if(!window.supabase)return false;
  try{
   fyflSupabase=window.supabase.createClient(FYFL_SUPABASE_URL,FYFL_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
   const {data,error}=await fyflSupabase.from("fyfl_matches").select("*");
   if(!error&&Array.isArray(data)){setRemoteResults(data);fyflRemoteReady=true}
   else console.warn("FYFL Supabase lecture:",error?.message);
   await loadOnlineSettings();await loadOnlineComments();
   fyflRealtimeChannel=fyflSupabase.channel("fyfl-live-all")
   .on("postgres_changes",{event:"*",schema:"public",table:"fyfl_matches"},payload=>{
    if(payload.eventType==="DELETE"){const key=payload.old?.match_key;results=results.filter(m=>fyflMatchKey({...m,day:m.day||findMatchDay(m)})!==key)}
    else if(payload.new){const incoming=fyflFromRow(payload.new);const i=results.findIndex(m=>fyflMatchKey({...m,day:m.day||findMatchDay(m)})===payload.new.match_key);if(i>=0)results[i]=incoming;else results.push(incoming)}
    flashLive();const pg=getCurrentPage();if(["home","matches","ranking","admin"].includes(pg))render(pg,false);
    if(payload.eventType==="UPDATE"&&payload.new?.status==="En direct"){const gs=Array.isArray(payload.new.goals)?payload.new.goals:[],g=gs[gs.length-1],sig=g?JSON.stringify(g):"";if(g&&sig!==window.__lastGoalSignature){window.__lastGoalSignature=sig;showGoalAnimation(g.team,g.scorer,g.minute)}}
   })
   .on("postgres_changes",{event:"*",schema:"public",table:"fyfl_settings"},payload=>{
    if(payload.new){fyflSettings={...fyflSettings,breaking:payload.new.breaking||fyflSettings.breaking,player:payload.new.player||fyflSettings.player,news:payload.new.news||fyflSettings.news,standings:(payload.new.standings&&typeof payload.new.standings==="object")?payload.new.standings:{}};applyAdminPrefs();flashLive();if(["home","news","ranking","admin"].includes(getCurrentPage()))render(getCurrentPage(),false)}
   })
   .on("postgres_changes",{event:"*",schema:"public",table:"fyfl_comments"},payload=>{
    if(payload.eventType==="DELETE")fyflComments=fyflComments.filter(c=>c.id!==payload.old?.id);else if(payload.new){const i=fyflComments.findIndex(c=>c.id===payload.new.id);if(i>=0)fyflComments[i]=payload.new;else fyflComments.unshift(payload.new)}
    if(getCurrentPage()==="comments")render("comments",false)

function getRanking(){
 const allTeams=Object.values(groups).flat();
 return allTeams.map(name=>{
  const r={name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  results.forEach(m=>{
   if(m.status!=="Terminé")return;
   const hs=Number(m.hs)||0,as=Number(m.as)||0;
   if(m.home===name){r.p++;r.gf+=hs;r.ga+=as;if(hs>as){r.w++;r.pts+=3}else if(hs===as){r.d++;r.pts++}else r.l++}
   if(m.away===name){r.p++;r.gf+=as;r.ga+=hs;if(as>hs){r.w++;r.pts+=3}else if(as===hs){r.d++;r.pts++}else r.l++}
  });
  r.diff=r.gf-r.ga;
  const ov=(fyflSettings.standings&&fyflSettings.standings[name])||null;
  if(ov){["p","w","d","l","gf","ga","pts"].forEach(k=>{if(ov[k]!==undefined&&ov[k]!==""&&Number.isFinite(Number(ov[k])))r[k]=Number(ov[k])});r.diff=ov.diff!==undefined&&ov.diff!==""?Number(ov.diff):r.gf-r.ga}
  return r
 })
}

function buildAllMatchDays(){

  }))

 if(!ok){alert("Impossible de réinitialiser ce match dans Supabase : "+(window.__fyflLastMatchSyncError||"erreur inconnue"));return}

 if(!error&&data){const refreshed=fyflFromRow(data),i=results.findIndex(r=>fyflMatchKey({...r,day:r.day||findMatchDay(r)})===data.match_key);if(i>=0)results[i]=refreshed;else results.push(refreshed)}
 flashLive();render("admin");broadcastLive()
}
function adminStandingTeamOptions(group){return(groups[group]||[]).map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("")}
function adminLoadStanding(){const group=document.getElementById("adminStandingGroup")?.value||"A",sel=document.getElementById("adminStandingTeam");if(!sel)return;const current=sel.value;sel.innerHTML=adminStandingTeamOptions(group);if(groups[group].includes(current))sel.value=current;adminLoadStandingFields()}
function adminLoadStandingFields(){const team=document.getElementById("adminStandingTeam")?.value;if(!team)return;const r=getRanking().find(x=>x.name===team)||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,diff:0};["p","w","d","l","gf","ga","pts","diff"].forEach(k=>{const e=document.getElementById("adminStand_"+k);if(e)e.value=r[k]??0})}
async function adminSaveStanding(){if(!isCurrentAccountAdminVerified())return;const team=document.getElementById("adminStandingTeam")?.value;if(!team)return;const standings={...(fyflSettings.standings||{})},row={};["p","w","d","l","gf","ga","pts","diff"].forEach(k=>row[k]=Math.max(0,Number(document.getElementById("adminStand_"+k)?.value||0)));standings[team]=row;if(await saveOnlineSettings({...fyflSettings,standings})){render("admin",false);alert("Classement synchronisé pour tout le monde !")}}
async function adminResetStanding(){if(!isCurrentAccountAdminVerified())return;const team=document.getElementById("adminStandingTeam")?.value;if(!team)return;const standings={...(fyflSettings.standings||{})};delete standings[team];if(await saveOnlineSettings({...fyflSettings,standings})){render("admin",false);alert("Classement remis au calcul automatique.")}}
async function adminSaveText(){const p=getAdminPrefs();p.breaking=(document.getElementById("adminBreaking").value||"").trim()||"REJOIGNEZ LE DISCORD POUR TOUTE LES INFO !";p.player=(document.getElementById("adminPlayer").value||"").trim()||"À déterminer";p.news=(document.getElementById("adminNews").value||"").trim()||"Les matchs FYFL se joueront les mercredis et les week-ends !";if(await saveOnlineSettings(p))alert("Modifications enregistrées !")}
function pageAdmin(){
 if(!isCurrentAccountAdminVerified())return`<section class="section"><div class="card"><h2>🔐 Accès administrateur</h2><p>Connecte-toi avec ton compte administrateur Supabase.</p><button onclick="openAdminLogin()" style="background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:900">Ouvrir l’administration</button></div></section>`;
 const p=getAdminPrefs();
 return`<section class="section admin-panel"><div class="section-head"><h2>⚙️ Panneau administrateur FYFL</h2><small>Contrôle en direct</small></div><div class="admin-grid">
 <div class="admin-box"><h3>⚽ Match en direct</h3><select id="adminMatchSelect" onchange="adminLoadMatch()">${adminMatchOptions()}</select><div class="admin-stat"><span>Score</span><input id="adminHomeScore" type="number" min="0"><b>—</b><input id="adminAwayScore" type="number" min="0"></div><label>Minute du match</label><input id="adminMinute" type="number" min="0" max="130"><div class="admin-actions"><button class="live" onclick="adminSetStatus('En direct')">🔴 Lancer / mettre à jour en direct</button><button class="done" onclick="adminFinish()">✅ Terminer le match</button><button class="reset" onclick="adminResetMatch()">🧹 Match jamais commencé</button></div><h4>⚽ Ajouter un but</h4><select id="adminGoalTeam"></select><input id="adminScorer" maxlength="40" placeholder="Nom du buteur"><input id="adminGoalMinute" type="number" min="0" max="130" placeholder="Minute du but"><button onclick="adminAddGoal()">⚽ Ajouter le but + animation</button><div id="adminGoals"></div><p class="admin-help">Les scores, minutes et buteurs sont sauvegardés dans Supabase et diffusés en direct à tous les visiteurs. « Match jamais commencé » remet le match à 0–0, À venir, minute 0 et supprime ses buts, puis synchronise le reset dans Supabase.</p></div>
 <div class="admin-box"><h3>📢 Site & annonces</h3><label>Breaking News</label><input id="adminBreaking" value="${escapeHtml(p.breaking)}"><label>Joueur du mois</label><input id="adminPlayer" value="${escapeHtml(p.player)}"><label>Message FYFL</label><textarea id="adminNews" rows="5">${escapeHtml(p.news)}</textarea><button onclick="adminSaveText()">💾 Enregistrer les modifications</button></div>
 <div class="admin-box"><h3>🏆 Modifier le classement</h3><label>Poule</label><select id="adminStandingGroup" onchange="adminLoadStanding()">${Object.keys(groups).map(g=>`<option value="${g}">Poule ${g}</option>`).join("")}</select><label>Équipe</label><select id="adminStandingTeam" onchange="adminLoadStandingFields()"></select><div class="admin-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${["p","w","d","l","gf","ga","diff","pts"].map(k=>`<label>${({p:"MJ",w:"V",d:"N",l:"D",gf:"BP",ga:"BC",diff:"Diff",pts:"Pts"})[k]}<input id="adminStand_${k}" type="number" min="${k==="diff"?"-999":"0"}></label>`).join("")}</div><div class="admin-actions"><button onclick="adminSaveStanding()">💾 Enregistrer</button><button class="reset" onclick="adminResetStanding()">↩️ Automatique</button></div></div>
 </div></section>`
}
function syncAdminGoalTeam(){const m=selectedAdminMatch(),sel=document.getElementById("adminGoalTeam");if(!m||!sel)return;sel.innerHTML=`<option>${escapeHtml(m.home)}</option><option>${escapeHtml(m.away)}</option>`;adminLoadMatch()}
function showGoalAnimation(team,scorer,minute){const pop=document.createElement("div");pop.className="goal-pop";pop.innerHTML=`<div class="goal-box"><div class="big">⚽</div><h2>BUUUUUT !</h2><p>${escapeHtml(team)} · ${escapeHtml(scorer)} · ${minute}'</p></div>`;document.body.appendChild(pop);for(let i=0;i<45;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*.25+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}setTimeout(()=>pop.remove(),950)}
function flashLive(){const el=document.getElementById("fyflLiveSync");if(!el)return;el.classList.add("show");clearTimeout(window.__fyflLiveFlash);window.__fyflLiveFlash=setTimeout(()=>el.classList.remove("show"),1200)}
function broadcastLive(){try{new BroadcastChannel("fyfl-live").postMessage({type:"update",at:Date.now()})}catch(e){}flashLive()}
function startLiveTicker(){if(window.__liveTimer)return;window.__liveTimer=setInterval(()=>{const pg=getCurrentPage();if(["matches","home","ranking","admin"].includes(pg))render(pg,false)},1000)}

function render(page="home",scroll=true){
 const app=document.getElementById("app");app.innerHTML=page==="home"?pageHome():page==="ranking"?pageRanking():page==="matches"?pageMatches():page==="teams"?pageTeams():page==="competitions"?pageCompetitions():page==="comments"?pageComments():page==="admin"?pageAdmin():pageNews();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));updateAuthUI();
 if(page==="admin")setTimeout(()=>{syncAdminGoalTeam();adminLoadStanding()},0);
 if(scroll)window.scrollTo({top:0,behavior:"smooth"})
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));
render();applyAdminPrefs();

function toggleHalloween(){document.body.classList.toggle("halloween-theme");const b=document.getElementById("halloweenToggle"),on=document.body.classList.contains("halloween-theme");b.textContent=on?"🎃 Halloween ON":"🌙 Halloween OFF";b.classList.toggle("off",!on);if(!on)document.querySelectorAll(".halloween-fall").forEach(e=>e.remove())}
function spawnPumpkin(){const p=document.createElement("div");p.className="halloween-fall";p.textContent=["🎃","🦇","🍬","🕸️"][Math.floor(Math.random()*4)];p.style.left=Math.random()*96+"vw";p.style.fontSize=18+Math.random()*18+"px";p.style.animationDuration=5+Math.random()*6+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),12000)}
setInterval(()=>{if(document.body.classList.contains("halloween-theme"))spawnPumpkin()},1800);
function nextWednesday(){const d=new Date(),day=d.getDay();let add=(3-day+7)%7;if(add===0&&d.getHours()>=18)add=7;const n=new Date(d);n.setDate(d.getDate()+add);n.setHours(18,0,0,0);return n}
function updateCountdown(){const el=document.getElementById("countdown");if(!el)return;const diff=Math.max(0,nextWednesday()-new Date()),h=Math.floor(diff/36e5),m=Math.floor(diff/6e4)%60,s=Math.floor(diff/1000)%60;el.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
setInterval(updateCountdown,1000);

(async()=>{
 await initFYFLSupabase();
 await refreshAdminSession();
 await ensureRemoteFixtureSeed();
 updateAuthUI();applyAdminPrefs();
 if(getCurrentPage()==="comments")render("comments",false);
 startLiveTicker();
 if(fyflSupabase)fyflSupabase.auth.onAuthStateChange((_event,session)=>{supabaseAdminUser=session?.user||null;adminUnlocked=!!supabaseAdminUser&&String(supabaseAdminUser.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();updateAuthUI();if(getCurrentPage()==="admin")render("admin",false)})
})();

const halloweenOverlay=document.getElementById("halloweenOverlay"),halloweenContinue=document.getElementById("halloweenContinue");
const spookyAudio=document.createElement("audio");spookyAudio.id="spookyPlayer";spookyAudio.src="spooky-skeletons.mp3";spookyAudio.preload="auto";spookyAudio.autoplay=true;spookyAudio.loop=false;spookyAudio.volume=.15;spookyAudio.setAttribute("playsinline","");document.body.appendChild(spookyAudio);
spookyAudio.addEventListener("timeupdate",()=>{if(!spookyAudio.paused&&spookyAudio.currentTime>=40){spookyAudio.currentTime=0;spookyAudio.play().catch(()=>{})}});
spookyAudio.play().catch(()=>{});
function updateSpookyToggle(){const b=document.getElementById("spookyToggle");if(!b)return;const paused=spookyAudio.paused;b.textContent=paused?"🔇":"🔊";b.classList.toggle("muted",paused);b.title=paused?"Activer Spooky Scary Skeletons":"Arrêter Spooky Scary Skeletons"}
function toggleSpookySound(){if(spookyAudio.paused)spookyAudio.play().catch(()=>{});else spookyAudio.pause();updateSpookyToggle()}
spookyAudio.addEventListener("play",updateSpookyToggle);spookyAudio.addEventListener("pause",updateSpookyToggle);updateSpookyToggle();
halloweenContinue.addEventListener("click",()=>{spookyAudio.volume=.30;spookyAudio.currentTime=0;spookyAudio.play().catch(()=>{});halloweenOverlay.style.transition="opacity .45s ease";halloweenOverlay.style.opacity="0";document.body.classList.add("halloween-theme");setTimeout(()=>halloweenOverlay.remove(),500)});
window.openAdmin=openAdmin;window.openAdminLogin=openAdminLogin;window.toggleSpookySound=toggleSpookySound;
</script>
