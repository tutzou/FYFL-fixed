    <script>
      // Support WASD (QWERTY) et ZQSD (AZERTY) en plus des flèches
      (function () {
        var keyCodes = { 'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39 };
        var map = {
          'w': 'ArrowUp', 'z': 'ArrowUp',
          'a': 'ArrowLeft', 'q': 'ArrowLeft',
          's': 'ArrowDown',
          'd': 'ArrowRight'
        };
        window.addEventListener('keydown', function (e) {
          // ignore si déjà une flèche ou si focus dans un champ
          var tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          var k = (e.key || '').toLowerCase();
          if (!map[k]) return;
          var arrow = map[k];
          e.preventDefault();
          e.stopImmediatePropagation();
          var ne = new KeyboardEvent('keydown', {
            key: arrow, code: arrow, keyCode: keyCodes[arrow], which: keyCodes[arrow],
            bubbles: true, cancelable: true
          });
          // Certains navigateurs ignorent keyCode dans le constructeur : on force
          try { Object.defineProperty(ne, 'keyCode', { value: keyCodes[arrow] }); } catch (err) {}
          try { Object.defineProperty(ne, 'which', { value: keyCodes[arrow] }); } catch (err) {}
          window.dispatchEvent(ne);
          var c = document.querySelector('canvas');
          if (c) c.dispatchEvent(ne);
        }, true);

        window.addEventListener('keyup', function (e) {
          var tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          var k = (e.key || '').toLowerCase();
          if (!map[k]) return;
          var arrow = map[k];
          e.preventDefault();
          var ne = new KeyboardEvent('keyup', {
            key: arrow, code: arrow, keyCode: keyCodes[arrow], which: keyCodes[arrow],
            bubbles: true, cancelable: true
          });
          try { Object.defineProperty(ne, 'keyCode', { value: keyCodes[arrow] }); } catch (err) {}
          try { Object.defineProperty(ne, 'which', { value: keyCodes[arrow] }); } catch (err) {}
          window.dispatchEvent(ne);
          var c = document.querySelector('canvas');
          if (c) c.dispatchEvent(ne);
        }, true);

        // Démarrage automatique : simule "Press to Play" dès le chargement
        function autoStart() {
          var c = document.querySelector('canvas');
          if (!c) return;
          c.focus();
          var click = new MouseEvent('click', { bubbles: true, clientX: c.width / 2, clientY: c.height / 2 });
          c.dispatchEvent(click);
          var sp = new KeyboardEvent('keydown', { key: ' ', code: 'Space', keyCode: 32, which: 32, bubbles: true, cancelable: true });
          try { Object.defineProperty(sp, 'keyCode', { value: 32 }); } catch (err) {}
          window.dispatchEvent(sp);
          c.dispatchEvent(sp);
        }
        var tries = 0;
        var iv = setInterval(function () {
          autoStart();
          // force la vitesse max en continu
          try { window.unityGame.SendMessage('Game','SetGameSpeed', 200); } catch(e){}
          try { window.unityGame.SendMessage('Game','LockGameSpeedTo', 200); } catch(e){}
          try { window.unityGame.SendMessage('Game','SetCurrentSpeed', 200); } catch(e){}
          tries++;
          if (tries >= 12) clearInterval(iv);
        }, 400);
        // arrête après 6s au cas où
        setTimeout(function () { clearInterval(iv); }, 6000);

        // maintient la vitesse max toute la run
        setInterval(function () {
          try { window.unityGame.SendMessage('Game','SetGameSpeed', 200); } catch(e){}
          try { window.unityGame.SendMessage('Game','LockGameSpeedTo', 200); } catch(e){}
          try { window.unityGame.SendMessage('Game','SetCurrentSpeed', 200); } catch(e){}
        }, 1000);

      })();
    </script>
