<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYFL — Compétitions</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#07101f;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:28px 18px}
a{color:inherit;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{padding:24px;border-radius:18px;background:linear-gradient(145deg,#17284b,#0d162b);border:1px solid rgba(255,255,255,.08)}
.card h2{margin:0 0 12px}.muted{opacity:.6}
@media(max-width:700px){.cards{grid-template-columns:1fr}.wrap{padding:20px 14px}}

/* FYFL V9 page transition */
body.fyfl-page-v9{animation:fyflFade .45s ease both}
@keyframes fyflFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<style id="competition-nav-button">
.nav-link[href="competitions.html"]{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 16px;border-radius:10px;
  text-decoration:none;white-space:nowrap;
}
.nav-link[href="competitions.html"]:hover{background:rgba(255,255,255,.06)}
</style>

<style id="fyfl-discord-button">
.fyfl-discord-button{
  position:fixed;left:18px;bottom:18px;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;z-index:9999;
  background:#5865F2;box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:transform .18s ease,box-shadow .18s ease;
}
.fyfl-discord-button:hover{transform:scale(1.08);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.fyfl-discord-button svg{width:29px;height:29px;fill:white}
@media(max-width:700px){.fyfl-discord-button{left:14px;bottom:14px;width:48px;height:48px}}
</style>
</head>
<body class="fyfl-page-v9"><main class="wrap">
<p><a href="index.html">← Retour à l'accueil</a></p>
<h1>🏆 Compétitions</h1>
<p class="muted">Les compétitions européennes seront déterminées après les poules.</p>
<div class="cards">
<div class="card"><h2>🏆 Ligue des Champions</h2><div class="muted">À venir après les poules</div></div>
<div class="card"><h2>🥈 Europa League</h2><div class="muted">À venir après les poules</div></div>
<div class="card"><h2>🥉 Conference League</h2><div class="muted">À venir après les poules</div></div>
</div></main>
<a class="fyfl-discord-button" href="https://discord.gg/fyfl" target="_blank" rel="noopener noreferrer" aria-label="Rejoindre le Discord FYFL" title="Discord FYFL">

  </svg>
</a>
</body></html>
